name: DRAMOVIX - APK Android e TV Box

# APKs só são gerados quando o usuário iniciar manualmente esta automação.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Gerar APK para celular e TV Box
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependências
        run: npm install

      - name: Verificar configurações do Supabase
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ]; then
            echo "::error::Falta configurar VITE_SUPABASE_URL nos Secrets."
            exit 1
          fi
          if [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::error::Falta configurar VITE_SUPABASE_ANON_KEY nos Secrets."
            exit 1
          fi
          echo "Configurações do Supabase presentes."

      - name: Compilar versão para celular
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Preparar Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Gerar APK para celular
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cd ..
          cp android/app/build/outputs/apk/debug/app-debug.apk DRAMOVIX-Android-APK.apk

      - name: Compilar versão otimizada para TV Box
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_TV_MODE: "true"
        run: |
          npm run build
          npx cap sync android

      - name: Habilitar instalação e navegação em Android TV
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("android/app/src/main/AndroidManifest.xml")
          manifest = path.read_text(encoding="utf-8")

          feature = '<uses-feature android:name="android.hardware.touchscreen" android:required="false" />'
          if "android.hardware.touchscreen" not in manifest:
              manifest = re.sub(r'(<manifest\b[^>]*>)', r'\1\n    ' + feature, manifest, count=1)

          launcher = '<category android:name="android.intent.category.LEANBACK_LAUNCHER" />'
          if "android.intent.category.LEANBACK_LAUNCHER" not in manifest:
              pattern = r'(<activity\b[^>]*>[\s\S]*?<category android:name="android.intent.category.LAUNCHER"\s*/>)'
              manifest, count = re.subn(pattern, r'\1\n                ' + launcher, manifest, count=1)
              if count != 1:
                  raise SystemExit("Não foi possível localizar a activity LAUNCHER para habilitar Android TV.")

          # A versão para TV Box deve iniciar em modo paisagem.
          activity_pattern = r'(<activity\b[^>]*android:name="[^"]*MainActivity"[^>]*)(>)'
          manifest, count = re.subn(
              activity_pattern,
              lambda match: re.sub(r'\s+android:screenOrientation="[^"]*"', '', match.group(1))
                  + ' android:screenOrientation="landscape"' + match.group(2),
              manifest,
              count=1
          )
          if count != 1:
              raise SystemExit("Não foi possível configurar a MainActivity para modo paisagem.")

          path.write_text(manifest, encoding="utf-8")

          gradle_path = Path("android/app/build.gradle")
          gradle = gradle_path.read_text(encoding="utf-8")
          if 'applicationId "com.dramovix.app"' not in gradle:
              raise SystemExit("Não foi possível localizar o applicationId original.")
          gradle = gradle.replace('applicationId "com.dramovix.app"', 'applicationId "com.dramovix.app.tv"', 1)
          gradle_path.write_text(gradle, encoding="utf-8")

          strings_path = Path("android/app/src/main/res/values/strings.xml")
          if strings_path.exists():
              strings = strings_path.read_text(encoding="utf-8")
              strings = re.sub(r'(<string name="app_name">).*?(</string>)', r'\1DRAMOVIX TV\2', strings, count=1)
              strings_path.write_text(strings, encoding="utf-8")

          print("Manifesto Android TV configurado; pacote separado com nome DRAMOVIX TV.")
          PY

      - name: Gerar APK para TV Box
        run: |
          cd android
          ./gradlew clean assembleDebug
          cd ..
          cp android/app/build/outputs/apk/debug/app-debug.apk DRAMOVIX-TV-Box-APK.apk

      - name: Disponibilizar APK para celular
        uses: actions/upload-artifact@v4
        with:
          name: DRAMOVIX-Android-APK
          path: DRAMOVIX-Android-APK.apk
          if-no-files-found: error
          retention-days: 14

      - name: Disponibilizar APK para TV Box
        uses: actions/upload-artifact@v4
        with:
          name: DRAMOVIX-TV-Box-APK
          path: DRAMOVIX-TV-Box-APK.apk
          if-no-files-found: error
          retention-days: 14
