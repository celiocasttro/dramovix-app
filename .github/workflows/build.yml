name: DRAMOVIX - APK Android

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Gerar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependências
        run: npm install

      - name: Verificar configurações do Supabase
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ]; then
            echo "::error::Falta configurar VITE_SUPABASE_URL nos Secrets."
            exit 1
          fi

          if [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::error::Falta configurar VITE_SUPABASE_ANON_KEY nos Secrets."
            exit 1
          fi

          echo "As duas configurações do Supabase estão presentes."

      - name: Compilar DRAMOVIX
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Preparar Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Gerar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: DRAMOVIX-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
