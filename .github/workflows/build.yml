name: DRAMOVIX - Android e iOS
on:
  workflow_dispatch:
  push:
    branches:
      - main
permissions:
  contents: read
jobs:
  android:
    name: Gerar APK Android
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Instalar dependências
        run: npm install
      - name: Compilar o DRAMOVIX
        run: npm run build
      - name: Preparar Android
        run: |
          npx cap add android
          npx cap sync android
      - name: Gerar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: DRAMOVIX-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
  ios:
    name: Preparar versão iOS
    runs-on: macos-26
    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependências
        run: npm install
      - name: Compilar o DRAMOVIX
        run: npm run build
      - name: Preparar iOS
        run: |
          npx cap add ios
          npx cap sync ios
      - name: Verificar projeto iOS
        run: |
          ls -la ios/App
          test -d ios/App/App.xcodeproj
      - name: Resolver dependências do iOS
        run: |
          xcodebuild \
            -resolvePackageDependencies \
            -project ios/App/App.xcodeproj \
            -scheme App
      - name: Compilar aplicativo iOS
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Disponibilizar aplicativo iOS
        uses: actions/upload-artifact@v4
        with:
          name: DRAMOVIX-iOS-Simulator
          path: build/ios/Build/Products/Debug-iphonesimulator/App.app
          if-no-files-found: error
